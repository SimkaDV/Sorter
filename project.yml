name: Sorter
options:
  bundleIdPrefix: local.sorter
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
packages:
  SorterCore:
    path: SorterCore
targets:
  Sorter:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: SorterCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 3D Models Sorter
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_NAME: 3D Models Sorter
        PRODUCT_BUNDLE_IDENTIFIER: local.sorter.app
        CODE_SIGN_ENTITLEMENTS: App/Sorter.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Sorter:
    build:
      targets:
        Sorter: all
    test:
      targets:
        - package: SorterCore/SorterCoreTests
